<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>FORMA · Admin</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500&family=Outfit:wght@500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{--bg:#F7F7F5;--box:#ECECEA;--ink:#141414;--soft:#77756F;--line:#DDDBD6;--ok:#3F6B4A;--bad:#9A3B33;--f:"Helvetica Neue",Helvetica,"Inter Tight",Arial,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--f)}
button,input,select,textarea{font:inherit;color:inherit}
header{display:flex;align-items:center;gap:24px;padding:14px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}
.logo{font:500 22px "Outfit",sans-serif;letter-spacing:-.02em}
.logo small{font:400 11px var(--f);letter-spacing:.12em;text-transform:uppercase;color:var(--soft);margin-left:8px}
nav{display:flex;gap:4px}
nav button,.btn{border:1px solid var(--line);background:#fff;padding:8px 14px;border-radius:999px;cursor:pointer}
nav button.on,.btn.dk{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn:disabled{opacity:.5;cursor:default}
.sp{flex:1}
.who{color:var(--soft);font-size:12px}
main{padding:20px;max-width:1400px;margin:0 auto}
.card{background:#fff;border:1px solid var(--line);border-radius:10px}
#login{max-width:380px;margin:12vh auto;padding:32px}
#login h1{font:500 28px "Outfit",sans-serif;margin:0 0 6px}
#login p{color:var(--soft);margin:0 0 20px}
label{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--soft);margin:12px 0 4px}
input,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:6px;background:#fff}
textarea{min-height:64px;resize:vertical}
.bar{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.bar input{max-width:260px}
table{width:100%;border-collapse:collapse}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--soft);font-weight:400;background:var(--bg)}
tr.off td{opacity:.45}
td img{width:48px;height:48px;object-fit:contain;background:var(--box);border-radius:4px;mix-blend-mode:multiply}
td input.num{width:110px;padding:6px 8px}
.n{text-align:right;font-variant-numeric:tabular-nums}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;background:var(--box)}
.pill.pagado{background:#DDE9DF;color:var(--ok)}.pill.cancelado{background:#F1DCD9;color:var(--bad)}.pill.en_camino{background:#E3E4F0}.pill.entregado{background:#E6E6E6}
.lnk{background:none;border:0;text-decoration:underline;cursor:pointer;padding:0}
.wrap{overflow-x:auto}
dialog{border:0;border-radius:12px;padding:0;width:min(760px,96vw);max-height:92vh}
dialog::backdrop{background:rgba(20,20,20,.4)}
.dh{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff}
.dh h2{margin:0;font:500 20px "Outfit",sans-serif}
.db{padding:4px 20px 20px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 14px}
.chk{display:flex;gap:18px;margin-top:14px;flex-wrap:wrap}.chk label{display:flex;gap:6px;align-items:center;text-transform:none;letter-spacing:0;font-size:14px;color:var(--ink);margin:0}.chk input{width:auto}
.ph{display:flex;gap:14px;margin-top:6px}.ph div{flex:1}.ph img{width:100%;aspect-ratio:1;object-fit:contain;background:var(--box);border-radius:6px;display:block;margin-bottom:6px}
.cl{display:flex;gap:8px;align-items:center;margin-top:6px}.cl input[type=color]{width:44px;height:36px;padding:2px}
.df{display:flex;justify-content:flex-end;gap:10px;padding:14px 20px;border-top:1px solid var(--line);position:sticky;bottom:0;background:#fff}
.hint{color:var(--soft);font-size:12px;margin-top:4px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:13px;z-index:20}
.stats{display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap}.stats .card{padding:12px 16px;min-width:150px}.stats b{display:block;font:500 22px "Outfit",sans-serif}.stats span{font-size:12px;color:var(--soft)}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}.mgrid .card{padding:10px;display:grid;gap:6px;align-content:start}.mgrid img{width:100%;aspect-ratio:1;object-fit:contain;background:var(--box);border-radius:6px;mix-blend-mode:multiply}.mgrid b{font-size:13px}.mgrid .k{font-size:12px;color:var(--soft);display:flex;justify-content:space-between}
th.s{cursor:pointer;white-space:nowrap}th.s:hover{color:var(--ink)}.sel{max-width:180px}.tag{font-size:11px;padding:1px 6px;border-radius:4px;background:#DDE9DF;color:var(--ok)}
.ecog{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;margin-bottom:16px}.ecog .card{padding:10px 12px}.ecog label{margin:0 0 4px}.ecog input{padding:6px 8px}
.pos{color:var(--ok)}.neg{color:var(--bad)}
td img{width:72px;height:72px}table.big td img,.cp td img{width:88px;height:88px}
.dirty{background:#FFF6D8!important}.dirty input{border-color:#C9A227}
.sbar{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:30;display:flex;gap:10px;align-items:center;background:#fff;border:1px solid var(--line);box-shadow:0 8px 30px rgba(0,0,0,.15);padding:10px 12px 10px 18px;border-radius:999px}.sbar[hidden]{display:none}
.sw{display:flex;gap:4px;flex-wrap:wrap;max-width:120px}.sw i{width:16px;height:16px;border-radius:50%;border:1px solid rgba(0,0,0,.15)}
.fg{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:6px}.fg-i{display:grid;gap:4px;font-size:12px}.fg-i img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:4px;background:var(--box)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}.fslot{padding:10px;display:grid;gap:6px;align-content:start}.fslot img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:6px;background:var(--box)}.fslot.chg{border-color:var(--ok)}.fsb{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.fsb label{margin:0;text-transform:none;letter-spacing:0;font-size:13px;color:#fff;cursor:pointer}
.colc{min-width:150px}.colc .hint{max-width:180px}
.cpick{position:fixed;z-index:40;width:340px;max-height:80vh;overflow:auto;padding:14px;display:grid;gap:12px;box-shadow:0 12px 40px rgba(0,0,0,.18)}
.cph{display:flex;justify-content:space-between;align-items:center;gap:10px}.cpl{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.cpc{display:flex!important;align-items:center;gap:6px;margin:0!important;text-transform:none!important;letter-spacing:0!important;font-size:13px!important;color:var(--ink)!important;cursor:pointer}.cpc input{width:auto}.cpc i{width:14px;height:14px;border-radius:50%;border:1px solid rgba(0,0,0,.15)}
.cpn{display:flex;gap:6px}.cpn #cph{width:44px;padding:2px}
.cm td,.cm th{text-align:center}.cm td:nth-child(2),.cm th:nth-child(2){text-align:left}.cm th i{display:block;width:18px;height:18px;border-radius:50%;margin:0 auto 4px;border:1px solid rgba(0,0,0,.15)}.cm input[type=checkbox]{width:18px;height:18px}
.kps{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin-bottom:14px}.kp{padding:12px 14px;display:grid;gap:2px}.kp span{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--soft)}.kp b{font:500 24px "Outfit",sans-serif;font-variant-numeric:tabular-nums}.kp em{font-style:normal;font-size:12px}.kp small{font-size:11.5px;color:var(--soft)}
.g2d{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:14px;margin-bottom:14px}.pad{padding:14px 16px}.pad h4{margin:0 0 10px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:500}
.chart{width:100%;height:auto;display:block}.chart .br{fill:#6E1F2B}.chart .gl{stroke:var(--line)}.chart .gt{font-size:10px;fill:var(--soft)}
.fn{display:grid;grid-template-columns:150px 1fr 44px 44px;gap:10px;align-items:center;font-size:13px;margin-bottom:8px}.fn small{color:var(--soft);font-size:11.5px;text-align:right}.fn b{text-align:right;font-variant-numeric:tabular-nums}
.fb{height:10px;background:var(--box);border-radius:3px;overflow:hidden}.fb i{display:block;height:100%;background:#6E1F2B}.fb.sm{height:6px;width:70px;display:inline-block;vertical-align:middle;margin-right:6px}
.rw{display:flex;justify-content:space-between;font-size:13px;padding:5px 0;border-bottom:1px solid var(--line)}
.live{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ok)}.live i{width:8px;height:8px;border-radius:50%;background:var(--ok);animation:pu 1.6s infinite}@keyframes pu{50%{opacity:.3}}
@media(max-width:700px){.fn{grid-template-columns:110px 1fr 36px 40px}}
@media(max-width:700px){header{flex-wrap:wrap;gap:10px}.g2,.g3{grid-template-columns:1fr}.hide-m{display:none}}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast" hidden></div>
<script>
const SB_URL='https://znzbwtewxpcpqtmjbmdw.supabase.co', SB_KEY='sb_publishable_DRouvIiAf-Vj354iZnNx5Q_XoOt3akE';
const sb=supabase.createClient(SB_URL,SB_KEY);
const PRE=0.45, OFF_1P=0.15;
const ESTADOS=['pendiente','pagado','en_camino','entregado','cancelado'];
const EST_TXT={pendiente:'Pendiente de pago',pagado:'Pagado',en_camino:'En camino',entregado:'Entregado',cancelado:'Cancelado'};
const $=s=>document.querySelector(s);
const app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ars=n=>n==null?'—':'$'+Math.round(n).toLocaleString('es-AR');
const pre=l=>l?Math.ceil(l*(1-PRE)/1000)*1000:null;
const src=n=>!n?'':/^https?:/.test(n)?n:'img/'+n+'.jpg';
function toast(t){const e=$('#toast');e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,2600)}
let tab='inicio', prods=[], orders=[], user=null, q='';

/* ---------- ingreso ---------- */
function viewLogin(msg=''){
  app.innerHTML=`<div class="card" id="login"><h1>forma</h1><p>Panel de administración.</p>
  <form id="lf"><label>Mail</label><input type="email" id="em" required autocomplete="username" value="formaconcept.ba@gmail.com">
  <label style="margin-top:10px">Contraseña</label><input type="password" id="pw" required autocomplete="current-password">
  <button class="btn dk" style="width:100%;margin-top:16px">Entrar</button></form>
  <p class="hint" style="margin-top:14px"><button class="lnk" id="fp">¿Primera vez o te olvidaste la contraseña?</button></p>
  <p class="hint" id="lm" style="margin-top:8px">${esc(msg)}</p></div>`;
  $('#lf').onsubmit=async e=>{e.preventDefault();const b=e.target.querySelector('button');b.disabled=true;
    const {error}=await sb.auth.signInWithPassword({email:$('#em').value.trim(),password:$('#pw').value});
    b.disabled=false;if(error)$('#lm').textContent='Mail o contraseña incorrectos. Si nunca creaste una contraseña, tocá el link de arriba.'};
  $('#fp').onclick=async()=>{const em=$('#em').value.trim();if(!em){$('#lm').textContent='Escribí tu mail primero.';return}
    const {error}=await sb.auth.resetPasswordForEmail(em,{redirectTo:location.origin+'/admin'});
    $('#lm').textContent=error?'No pudimos mandar el mail. Probá en unos minutos.':'Te mandamos un mail para crear tu contraseña. Abrilo y seguí el link.'};
}
function viewNewPass(){
  app.innerHTML=`<div class="card" id="login"><h1>forma</h1><p>Elegí tu contraseña para entrar al panel. Mínimo 8 caracteres.</p>
  <form id="nf"><label>Nueva contraseña</label><input type="password" id="np" required minlength="8" autocomplete="new-password">
  <label style="margin-top:10px">Repetila</label><input type="password" id="np2" required minlength="8" autocomplete="new-password">
  <button class="btn dk" style="width:100%;margin-top:16px">Guardar y entrar</button></form><p class="hint" id="nm" style="margin-top:14px"></p></div>`;
  $('#nf').onsubmit=async e=>{e.preventDefault();if($('#np').value!==$('#np2').value){$('#nm').textContent='Las contraseñas no coinciden.';return}
    const {error}=await sb.auth.updateUser({password:$('#np').value});
    if(error){$('#nm').textContent='No se pudo guardar: '+error.message;return}
    try{history.replaceState(null,'',location.pathname)}catch(_){} user=null;start()};
}
async function start(){
  const {data:{session}}=await sb.auth.getSession();
  if(recovering&&session){viewNewPass();return}
  if(!session){viewLogin();return}
  user=session.user;
  const {data:isAdm}=await sb.rpc('is_admin');
  if(!isAdm){await sb.auth.signOut();viewLogin('Ese mail no tiene permiso de administrador.');return}
  shell();
}
let recovering=/type=recovery/.test(location.hash);
sb.auth.onAuthStateChange((ev)=>{if(ev==='PASSWORD_RECOVERY'){recovering=true;viewNewPass();return}if(ev==='SIGNED_IN'&&!user&&!recovering)start()});

/* ---------- estructura ---------- */
function shell(){
  app.innerHTML=`<header><div class="logo">forma<small>Admin</small></div>
  <nav style="flex-wrap:wrap"><button data-t="inicio">Inicio</button><button data-t="productos">Productos</button><button data-t="pedidos">Pedidos</button><button data-t="pro">Profesionales</button><button data-t="frm">FRM Studio</button><button data-t="fotos">Fotos</button><button data-t="maestro">Maestro</button><button data-t="eco">Economía</button><button data-t="compras">Compras</button></nav>
  <span class="sp"></span><a class="who hide-m" href="/" target="_blank">Ver la tienda ↗</a><span class="who hide-m">${esc(user.email)}</span><button class="btn hide-m" id="chp">Cambiar contraseña</button><button class="btn" id="out">Salir</button></header><main id="m"></main>`;
  app.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;draw()});
  $('#out').onclick=async()=>{await sb.auth.signOut();user=null;viewLogin()};
  $('#chp').onclick=()=>viewNewPass();
  draw();
}
async function draw(){
  app.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
  if(tab==='inicio'){await drawInicio();await drawSubs()}else if(tab==='productos'){await loadProds();drawProds()}else if(tab==='arr'){await drawArr()}else if(tab==='pro'){await drawPro();await loadMaster();await drawCatPro()}else if(tab==='colores'){await drawColores()}else if(tab==='frm'){await drawFrm()}else if(tab==='fotos'){await drawFotos()}else if(tab==='maestro'){await Promise.all([loadMaster(),prods.length?0:loadProds()]);drawMaster()}else if(tab==='eco'){await loadMaster();await drawEco()}else if(tab==='compras'){await loadMaster();await drawCompras()}else{await loadOrders();drawOrders();$('#m').insertAdjacentHTML('afterbegin','<div class="bar"><span class="sp"></span><a class="btn" href="#arrh">Ver arrepentimientos ↓</a></div>');$('#m').insertAdjacentHTML('beforeend','<h3 id="arrh" style="margin:36px 0 10px">Arrepentimientos</h3><div id="arrw"></div>');await drawArr()}
}

/* ---------- productos ---------- */
async function loadProds(){const {data,error}=await sb.from('products').select('*').order('orden');if(error){toast('Error al leer productos');return}prods=data;const r=await sb.from('product_b2b').select('*');b2b=Object.fromEntries((r.data||[]).map(x=>[x.product_id,x.precio]))}
let b2b={};
/* ---------- cambios pendientes: se editan muchas cosas y se guarda todo junto ---------- */
const PEND=new Map();
function mark(el,table,pkCol,pk,field,value){PEND.set(`${table}|${pk}|${field}`,{table,pkCol,pk,field,value});el&&el.closest('td,.card')?.classList.add('dirty');saveBar()}
function saveBar(){let b=$('#sbar');if(!b){b=document.createElement('div');b.id='sbar';b.className='sbar';document.body.appendChild(b)}
  b.hidden=!PEND.size;b.innerHTML=`<span><b>${PEND.size}</b> cambio${PEND.size>1?'s':''} sin guardar</span><button class="btn" id="sdis">Descartar</button><button class="btn dk" id="ssave">Guardar cambios</button>`;
  $('#sdis').onclick=()=>{PEND.clear();saveBar();draw()};
  $('#ssave').onclick=async()=>{const btn=$('#ssave');btn.disabled=true;btn.textContent='Guardando…';const g={};
    PEND.forEach(c=>{const k=c.table+'|'+c.pk;(g[k]=g[k]||{table:c.table,pkCol:c.pkCol,pk:c.pk,patch:{}}).patch[c.field]=c.value});
    let err=0;for(const x of Object.values(g)){const patch={...x.patch};if(x.table==='products')patch.updated_at=new Date().toISOString();
      const {error}=x.table==='settings'?await sb.from('settings').upsert({key:x.pk,value:patch.value}):await sb.from(x.table).update(patch).eq(x.pkCol,x.pk);if(error){err++;console.warn(error)}}
    PEND.clear();saveBar();toast(err?`Se guardó con ${err} error(es)`:'Cambios guardados. Ya se ven en la tienda.');draw()}}
window.addEventListener('beforeunload',e=>{if(PEND.size){e.preventDefault();e.returnValue=''}});
/* orden de tablas: clic en el título de la columna */
const SORT={};
function sortBy(tab,list,get){const s=SORT[tab];if(!s)return list;return [...list].sort((a,b)=>{const x=get(a,s.k),y=get(b,s.k);if(x==null||x==='')return 1;if(y==null||y==='')return -1;return (typeof x==='number'&&typeof y==='number'?x-y:String(x).localeCompare(String(y),'es'))*s.d})}
const thS=(tab,k,t,c='')=>`<th class="s ${c}" data-st2="${tab}|${k}">${t}${SORT[tab]?.k===k?(SORT[tab].d>0?' ↑':' ↓'):''}</th>`;
function bindSort(redraw){$('#m').querySelectorAll('[data-st2]').forEach(h=>h.onclick=()=>{const[tab,k]=h.dataset.st2.split('|');const s=SORT[tab];SORT[tab]={k,d:s&&s.k===k?-s.d:1};redraw()})}

function drawProds(){
  let list=prods.filter(p=>!q||(p.tipo+' '+p.nombre+' '+p.id+' '+p.linea+' '+p.categoria).toLowerCase().includes(q.toLowerCase()));
  list=sortBy('prods',list,(p,k)=>({nombre:p.tipo+' '+p.nombre,cat:p.linea+' '+p.categoria,lista:p.precio_lista,pre:preP(p),pct:pctP(p),cupo:p.unidades,vend:p.vendidas,pub:p.activo?0:1,disp:p.disponibilidad||''}[k]));
  const vend=prods.reduce((a,p)=>a+(p.vendidas||0),0), cupo=prods.filter(p=>p.activo).reduce((a,p)=>a+(p.unidades||0),0);
  $('#m').innerHTML=`<div class="stats"><div class="card"><b>${prods.filter(p=>p.activo).length}</b><span>productos publicados</span></div><div class="card"><b>${vend} / ${cupo}</b><span>unidades vendidas en preventa</span></div></div>
  <div class="bar"><input id="q" placeholder="Buscar…" value="${esc(q)}"><span class="sp"></span><button class="btn dk" id="nw">+ Nuevo producto</button></div>
  <div class="card wrap"><table class="big"><thead><tr><th></th>${thS('prods','nombre','Producto')}${thS('prods','cat','Línea · Categoría','hide-m')}${thS('prods','lista','Precio de lista','n')}${thS('prods','pre','Preventa','n hide-m')}${thS('prods','pct','% preventa','n hide-m')}<th>Colores</th>${thS('prods','cupo','Cupo','n')}${thS('prods','vend','Vendidas','n')}${thS('prods','disp','Disponibilidad')}${thS('prods','pub','Publicado')}<th></th></tr></thead><tbody>
  ${list.map(p=>`<tr class="${p.activo?'':'off'}" data-id="${esc(p.id)}"><td><img src="${esc(src(p.img))}" alt=""></td>
   <td><b>${esc(p.tipo)} ${esc(p.nombre)}</b><div class="hint">${esc(p.id)}</div></td><td class="hide-m">${esc(p.linea)} · ${esc(p.categoria)}</td>
   <td class="n"><input class="num n money" data-f="precio_lista" value="${money(p.precio_lista)}" inputmode="numeric" placeholder="sin precio"></td>
   <td class="n hide-m"><input class="num n money" data-f="precio_preventa" value="${money(preP(p))}" inputmode="numeric" title="Escribí un precio para fijarlo a mano. Borralo para que lo calcule el %"><div class="hint" data-ph>${p.precio_preventa?'fijado a mano':'por %'}</div></td>
   <td class="n hide-m"><input class="num n" style="width:64px" data-pct value="${pctP(p)}" inputmode="numeric"><div class="hint">% off</div></td>
   <td class="colc" data-colp="p|${esc(p.id)}">${swatches(p.colores)}<button class="lnk">Elegir</button></td>
   <td class="n"><input class="num n" style="width:70px" data-f="unidades" value="${p.unidades??0}" inputmode="numeric"></td>
   <td class="n"><input class="num n" style="width:70px" data-f="vendidas" value="${p.vendidas??0}" inputmode="numeric"></td>

/* ---------- maestro · economía · compras ---------- */
let master=[], ST={}, MF={q:'',prov:'',cat:'',mat:'',est:'',sort:'codigo',dir:1,view:'tabla'};
let OC=[];try{OC=JSON.parse(localStorage.getItem('fa_oc')||'[]')}catch(e){}
const saveOC=()=>{try{localStorage.setItem('fa_oc',JSON.stringify(OC))}catch(e){}};
async function loadMaster(){const [{data:m},{data:s}]=await Promise.all([sb.from('master_productos').select('*').order('codigo'),sb.from('settings').select('*')]);master=m||[];ST=Object.fromEntries((s||[]).map(x=>[x.key,+x.value]))}
const costo=(fob,cbm)=>{if(fob==null||cbm==null)return null;const s=ST,fl=s.flete_cont*cbm/s.cap_cbm,cif=fob+fl+fob*s.seguro;return (cif+s.gastos_fijos_cont*cbm/s.cap_cbm+fob*s.honorarios+s.resguardo*cbm/s.cap_cbm+cif*s.arancel)*(1+s.imprevistos)};
const usd=n=>n==null?'—':'US$ '+(+n).toLocaleString('es-AR',{minimumFractionDigits:2,maximumFractionDigits:2});
const pct=n=>n==null||!isFinite(n)?'—':Math.round(n*100)+'%';
const ppro=m=>{const c=costo(m.fob_usd,m.cbm);return c==null?null:Math.ceil(c*(1+(m.markup??ST.markup_pro))*(1+ST.iva)*ST.tc/1000)*1000};
const byCod=c=>master.find(m=>m.codigo===c);
const uniq=k=>[...new Set(master.map(m=>m[k]).filter(Boolean))].sort();

function drawMaster(){
  let L=master.filter(m=>(!MF.prov||m.proveedor===MF.prov)&&(!MF.cat||m.subcategoria===MF.cat)&&(!MF.mat||m.material===MF.mat)&&(!MF.est||m.estado===MF.est)
    &&(!MF.q||[m.codigo,m.descripcion,m.cod_proveedor,m.material,m.medidas,m.familia].join(' ').toLowerCase().includes(MF.q.toLowerCase())));
  const val=m=>({costo:costo(m.fob_usd,m.cbm),pro:ppro(m)}[MF.sort]??m[MF.sort]);
  L.sort((a,b)=>{const x=val(a),y=val(b);if(x==null)return 1;if(y==null)return -1;return (typeof x==='number'?x-y:String(x).localeCompare(String(y)))*MF.dir});
  const opt=(k,lab)=>`<select class="sel" data-mf="${k}"><option value="">${lab}</option>${uniq({prov:'proveedor',cat:'subcategoria',mat:'material',est:'estado'}[k]).map(v=>`<option ${MF[k]===v?'selected':''}>${esc(v)}</option>`).join('')}</select>`;
  const th=(k,t,c='')=>`<th class="s ${c}" data-sort="${k}">${t}${MF.sort===k?(MF.dir>0?' ↑':' ↓'):''}</th>`;
  const inShop=new Set(prods.map(p=>p.id));
  $('#m').innerHTML=`<div class="stats"><div class="card"><b>${master.length}</b><span>productos en el Master</span></div><div class="card"><b>${uniq('proveedor').length}</b><span>proveedores</span></div><div class="card"><b>${L.length}</b><span>con estos filtros</span></div><div class="card"><b>${OC.reduce((a,l)=>a+l.q,0)}</b><span>unidades en la orden en armado</span></div></div>
  <div class="bar"><input id="mq" placeholder="Buscar código, nombre, material…" value="${esc(MF.q)}">${opt('prov','Proveedor')}${opt('cat','Subcategoría')}${opt('mat','Material')}${opt('est','Estado')}<span class="sp"></span>
  <button class="btn ${MF.view==='tabla'?'dk':''}" data-v="tabla">Tabla</button><button class="btn ${MF.view==='grilla'?'dk':''}" data-v="grilla">Fotos</button></div>
  ${MF.view==='grilla'?`<div class="mgrid">${L.map(m=>`<div class="card"><img src="${esc(m.foto_url||'')}" alt="" loading="lazy"><b>${esc(m.descripcion)}</b><div class="k"><span>${esc(m.codigo)}</span><span>${esc(m.proveedor||'')}</span></div><div class="k"><span>FOB ${usd(m.fob_usd)}</span><span>${m.cbm??'—'} m³</span></div><div class="k"><span>Costo ${usd(costo(m.fob_usd,m.cbm))}</span><span>MOQ ${m.moq??'—'}</span></div><button class="btn" data-oc="${esc(m.codigo)}">+ Orden de compra</button></div>`).join('')}</div>`
  :`<div class="card wrap"><table><thead><tr><th></th>${th('codigo','Producto')}${th('proveedor','Proveedor','hide-m')}${th('subcategoria','Subcategoría','hide-m')}${th('material','Material','hide-m')}${th('medidas','Medidas (mm)','hide-m')}${th('moq','MOQ','n')}${th('fob_usd','FOB','n')}${th('cbm','m³','n')}${th('costo','Costo puesto','n')}<th class="n">Margen pro</th>${th('pro','Precio pro','n')}<th></th></tr></thead><tbody>
  ${L.map(m=>`<tr><td><img src="${esc(m.foto_url||'')}" alt="" loading="lazy"></td><td><b>${esc(m.descripcion)}</b> ${inShop.has(m.codigo)?'<span class="tag">en tienda</span>':''}<div class="hint">${esc(m.codigo)} · ${esc(m.cod_proveedor||'')} · ${esc(m.estado||'')}</div></td>
   <td class="hide-m">${esc(m.proveedor)}</td><td class="hide-m">${esc(m.subcategoria)}</td><td class="hide-m">${esc(m.material)}<div class="hint">${esc(m.terminacion||'')}</div></td><td class="hide-m">${esc(m.medidas)}</td>
   <td class="n">${m.moq??'—'}</td><td class="n">${usd(m.fob_usd)}</td><td class="n">${m.cbm??'—'}</td><td class="n">${usd(costo(m.fob_usd,m.cbm))}</td>
   <td class="n"><input class="num n" style="width:70px" data-mk="${esc(m.codigo)}" value="${m.markup!=null?Math.round(m.markup*100):''}" placeholder="${Math.round(ST.markup_pro*100)}" title="% sobre costo. Vacío = general"></td>
   <td class="n">${ars(ppro(m))}</td><td style="white-space:nowrap"><button class="lnk" data-oc="${esc(m.codigo)}">+ OC</button> · <button class="lnk" data-addpro="${esc(m.codigo)}">+ Pro</button></td></tr>`).join('')}</tbody></table></div>`}
  <p class="hint">Costo puesto en Argentina por unidad, sin IVA, con el contenedor lleno (parámetros en Economía). Precio pro = costo × (1 + margen) + IVA, al tipo de cambio.</p>`;
  $('#mq').oninput=e=>{MF.q=e.target.value;const p=e.target.selectionStart;drawMaster();const i=$('#mq');i.focus();i.setSelectionRange(p,p)};
  $('#m').querySelectorAll('[data-mf]').forEach(s=>s.onchange=()=>{MF[s.dataset.mf]=s.value;drawMaster()});
  $('#m').querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{MF.view=b.dataset.v;drawMaster()});
  $('#m').querySelectorAll('[data-sort]').forEach(h=>h.onclick=()=>{const k=h.dataset.sort;MF.dir=MF.sort===k?-MF.dir:1;MF.sort=k;drawMaster()});
  $('#m').querySelectorAll('[data-mk]').forEach(i=>i.onchange=()=>{const v=i.value.trim()===''?null:(+i.value.replace(',','.'))/100;byCod(i.dataset.mk).markup=v;mark(i,'master_productos','codigo',i.dataset.mk,'markup',v)});
  $('#m').querySelectorAll('[data-addpro]').forEach(b=>b.onclick=async()=>{const {error}=await sb.from('catalogo_pro').upsert({codigo:b.dataset.addpro,activo:true});toast(error?'No se pudo agregar':'Agregado al catálogo profesional')});
  $('#m').querySelectorAll('[data-oc]').forEach(b=>b.onclick=()=>{const m=byCod(b.dataset.oc);const l=OC.find(x=>x.codigo===m.codigo);if(l)l.q+=(+m.moq||1);else OC.push({codigo:m.codigo,q:+m.moq||1,color:''});saveOC();toast('Agregado a la orden de compra ('+m.codigo+')');drawMaster()});
}

async function drawEco(){
  if(!prods.length)await loadProds();
  const SL=[['tc','Tipo de cambio (ARS por USD)',1],['envio_express','Envío express al cliente (ARS)',1],['flete_cont','Flete del contenedor (USD)',1],['cap_cbm','Capacidad del contenedor (m³)',1],['gastos_fijos_cont','Despacho, terminal, transporte y verificación (USD)',1],['resguardo','Resguardo / depósito (USD)',1],['seguro','Seguro (% s/FOB)',100],['honorarios','Honorarios despachante (% s/FOB)',100],['arancel','Arancel (% s/CIF)',100],['imprevistos','Imprevistos (% s/costo)',100],['iva','IVA (%)',100],['markup_pro','Margen profesionales (% s/costo)',100],['markup_venta','Markup sugerido al público (% s/costo)',100]];
  const rows=prods.map(p=>{const m=byCod(p.id);const c=m?costo(m.fob_usd,m.cbm):null;const cA=c==null?null:c*ST.tc;const pv=preP(p);const net=pv?pv/(1+ST.iva):null;const pp=m?ppro(m):null;
    return {p,m,c,cA,pv,mpv:cA&&net?(net-cA)/net:null,gpv:cA&&net?net-cA:null,pp,mpp:cA&&pp?(pp/(1+ST.iva)-cA)/(pp/(1+ST.iva)):null,lista:p.precio_lista,sug:c==null?null:Math.ceil(c*(1+ST.markup_venta)*(1+ST.iva)*ST.tc/1000)*1000}});
  const pc=x=>x==null?'—':`<span class="${x<0.15?'neg':'pos'}">${pct(x)}</span>`;
  $('#m').innerHTML=`<h3 style="margin:0 0 10px">Parámetros</h3><div class="ecog">${SL.map(([k,l,f])=>`<div class="card"><label>${l}</label><input data-ek="${k}" data-f="${f}" value="${ST[k]!=null?+(ST[k]*f).toFixed(4):''}" inputmode="decimal"></div>`).join('')}</div>
  <p class="hint" style="margin:-6px 0 18px">Cambiá un valor y la tabla se recalcula al instante. Se guarda al salir de la casilla y actualiza los precios profesionales de la tienda.</p>
  <h3 style="margin:0 0 10px">Productos de la tienda</h3>
  <div class="card wrap"><table><thead><tr><th>Producto</th><th class="n">Costo USD</th><th class="n">Costo ARS</th><th class="n">Lista</th><th class="n hide-m">Sugerido</th><th class="n">Preventa</th><th class="n">Ganancia x u.</th><th class="n">Margen preventa</th><th class="n">Precio pro</th><th class="n">Margen pro</th></tr></thead><tbody>
  ${rows.map(r=>`<tr><td><b>${esc(r.p.tipo)} ${esc(r.p.nombre)}</b><div class="hint">${esc(r.p.id)}${r.m?'':' · sin datos en el Master'}</div></td><td class="n">${usd(r.c)}</td><td class="n">${ars(r.cA)}</td><td class="n">${ars(r.lista)}</td><td class="n hide-m">${ars(r.sug)}</td><td class="n">${ars(r.pv)}</td><td class="n">${ars(r.gpv)}</td><td class="n">${pc(r.mpv)}</td><td class="n">${ars(r.pp)}</td><td class="n">${pc(r.mpp)}</td></tr>`).join('')}</tbody></table></div>
  <p class="hint">Precios con IVA; costos y márgenes sin IVA. Margen = (precio sin IVA − costo) ÷ precio sin IVA. En rojo, menos de 15%. "Sugerido" = costo × (1 + markup al público) + IVA.</p>`;
  $('#m').querySelectorAll('[data-ek]').forEach(i=>{const k=i.dataset.ek,f=+i.dataset.f;
    i.oninput=()=>{const v=parseFloat(i.value.replace(',','.'));if(!isNaN(v)){ST[k]=v/f;clearTimeout(drawEco.t);drawEco.t=setTimeout(()=>{const a=document.activeElement?.dataset?.ek;drawEco().then(()=>{if(a){const e=$(`[data-ek="${a}"]`);e.focus();e.setSelectionRange(e.value.length,e.value.length)}})},500)}};
    i.onchange=()=>{const v=parseFloat(i.value.replace(',','.'));if(isNaN(v)){toast('Número inválido');return}mark(i,'settings','key',k,'value',v/f)}});
}

async function drawCompras(){
  const {data:hist}=await sb.from('compras').select('*').order('created_at',{ascending:false});
  const lines=OC.map(l=>({...l,m:byCod(l.codigo)})).filter(l=>l.m);
  const provs=[...new Set(lines.map(l=>l.m.proveedor))];
  const ECS=['borrador','enviado','confirmado','en producción','embarcado','recibido','cancelado'];
  $('#m').innerHTML=`<h3 style="margin:0 0 10px">Orden en armado</h3>
  ${lines.length?provs.map(pv=>{const ls=lines.filter(l=>l.m.proveedor===pv),fob=ls.reduce((a,l)=>a+(l.m.fob_usd||0)*l.q,0),cbm=ls.reduce((a,l)=>a+(l.m.cbm||0)*l.q,0);
    return `<div class="card wrap" style="margin-bottom:14px"><div class="bar" style="padding:12px 12px 0"><b>${esc(pv)}</b><span class="hint">FOB ${usd(fob)} · ${cbm.toFixed(2)} m³ · ${pct(cbm/ST.cap_cbm)} del contenedor</span><span class="sp"></span><button class="btn" data-doc="rfq" data-pv="${esc(pv)}">Generar RFQ</button><button class="btn dk" data-doc="oc" data-pv="${esc(pv)}">Generar orden de compra</button></div>
    <table><thead><tr><th></th><th>Producto</th><th class="n">MOQ</th><th class="n">Cantidad</th><th>Color / terminación</th><th class="n">FOB unit.</th><th class="n">FOB total</th><th class="n">m³</th><th></th></tr></thead><tbody>
    ${ls.map(l=>`<tr><td><img src="${esc(l.m.foto_url||'')}" alt=""></td><td><b>${esc(l.m.descripcion)}</b><div class="hint">${esc(l.m.codigo)} · ${esc(l.m.cod_proveedor||'')}</div></td><td class="n">${l.m.moq??'—'}</td>
     <td class="n"><input class="num n" style="width:80px" data-oq="${esc(l.codigo)}" value="${l.q}" inputmode="numeric">${l.m.moq&&l.q<l.m.moq?'<div class="hint neg">menos que el MOQ</div>':''}</td>
     <td><input data-oco="${esc(l.codigo)}" value="${esc(l.color)}" placeholder="ej. Terracota RAL 3012"></td><td class="n">${usd(l.m.fob_usd)}</td><td class="n">${usd((l.m.fob_usd||0)*l.q)}</td><td class="n">${((l.m.cbm||0)*l.q).toFixed(2)}</td><td><button class="lnk" data-orm="${esc(l.codigo)}">Quitar</button></td></tr>`).join('')}</tbody></table></div>`}).join('')
  :`<div class="card" style="padding:28px;text-align:center;color:var(--soft)">Todavía no agregaste productos. Andá a <b>Maestro</b> y tocá "+ OC" en los productos que querés pedir.</div>`}
  <h3 style="margin:24px 0 10px">Historial de RFQ y órdenes de compra</h3>
  ${(hist||[]).length?`<div class="card wrap"><table><thead><tr><th>N°</th><th>Fecha</th><th>Tipo</th><th>Proveedor</th><th class="n">Ítems</th><th class="n">FOB</th><th class="n">m³</th><th>Estado</th><th></th></tr></thead><tbody>
  ${hist.map(h=>`<tr><td>${esc(h.numero)}</td><td>${new Date(h.created_at).toLocaleDateString('es-AR')}</td><td>${h.tipo==='oc'?'Orden de compra':'RFQ'}</td><td>${esc(h.proveedor)}</td><td class="n">${(h.items||[]).length}</td><td class="n">${usd(h.total_fob)}</td><td class="n">${(+h.cbm).toFixed(2)}</td>
   <td><select data-ces="${h.id}">${ECS.map(s=>`<option ${s===h.estado?'selected':''}>${s}</option>`).join('')}</select></td><td><button class="lnk" data-ver="${h.id}">Ver / imprimir</button></td></tr>`).join('')}</tbody></table></div>`
  :`<div class="card" style="padding:20px;text-align:center;color:var(--soft)">Sin documentos todavía.</div>`}`;
  $('#m').querySelectorAll('[data-oq]').forEach(i=>i.onchange=()=>{const l=OC.find(x=>x.codigo===i.dataset.oq);l.q=Math.max(1,parseInt(i.value)||1);saveOC();drawCompras()});
  $('#m').querySelectorAll('[data-oco]').forEach(i=>i.onchange=()=>{OC.find(x=>x.codigo===i.dataset.oco).color=i.value;saveOC()});
  $('#m').querySelectorAll('[data-orm]').forEach(b=>b.onclick=()=>{OC=OC.filter(x=>x.codigo!==b.dataset.orm);saveOC();drawCompras()});
  $('#m').querySelectorAll('[data-ces]').forEach(s=>s.onchange=async()=>{const {error}=await sb.from('compras').update({estado:s.value}).eq('id',+s.dataset.ces);toast(error?'No se pudo cambiar':'Estado actualizado')});
  $('#m').querySelectorAll('[data-ver]').forEach(b=>b.onclick=()=>docWin((hist||[]).find(h=>h.id===+b.dataset.ver)));
  $('#m').querySelectorAll('[data-doc]').forEach(b=>b.onclick=async()=>{const tipo=b.dataset.doc,pv=b.dataset.pv;const ls=lines.filter(l=>l.m.proveedor===pv);
    const items=ls.map(l=>({codigo:l.codigo,cod_proveedor:l.m.cod_proveedor,descripcion:l.m.descripcion,medidas:l.m.medidas,material:l.m.material,color:l.color,q:l.q,fob:l.m.fob_usd,cbm:l.m.cbm,foto:l.m.foto_url}));
    const d={tipo,proveedor:pv,items,total_fob:+items.reduce((a,i)=>a+(i.fob||0)*i.q,0).toFixed(2),cbm:+items.reduce((a,i)=>a+(i.cbm||0)*i.q,0).toFixed(3),estado:'borrador'};
    const {data,error}=await sb.from('compras').insert(d).select().single();if(error){toast('No se pudo guardar: '+error.message);return}
    if(tipo==='oc'){OC=OC.filter(l=>byCod(l.codigo)?.proveedor!==pv);saveOC()}
    docWin(data);drawCompras()});
}
function docWin(h){
  const oc=h.tipo==='oc',d=new Date(h.created_at);
  const html=`<!doctype html><html><head><meta charset="utf-8"><title>${oc?'Purchase Order':'RFQ'} ${esc(h.numero)}</title><style>body{font:13px/1.45 Helvetica,Arial,sans-serif;color:#141414;margin:40px}h1{font:500 26px Helvetica;margin:0}table{width:100%;border-collapse:collapse;margin-top:18px}th,td{border-bottom:1px solid #ddd;padding:8px;text-align:left;vertical-align:top}th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:#666}td.n,th.n{text-align:right}img{width:56px;height:56px;object-fit:contain}.top{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid #141414;padding-bottom:14px}.m{color:#666}.terms{margin-top:22px;font-size:12px}button{margin-top:20px;padding:10px 18px}@media print{button{display:none}body{margin:16mm}}</style></head><body>
  <div class="top"><div><h1>${oc?'PURCHASE ORDER':'REQUEST FOR QUOTATION'}</h1><div class="m">N° ${esc(h.numero)} · Date ${d.toISOString().slice(0,10)}</div></div><div style="text-align:right"><b>FORMA Concept</b><br>DEL GRUPPO S.R.L. · CUIT 30-71294990-9<br>Av. Belgrano 148, 7th floor, Buenos Aires, Argentina<br>formaconcept.ba@gmail.com · +54 11 3944 3055</div></div>
  <p><b>Supplier:</b> ${esc(h.proveedor)}</p>
  <table><thead><tr><th></th><th>Our code</th><th>Supplier code</th><th>Description</th><th>Size (mm)</th><th>Color / finish</th><th class="n">Qty</th>${oc?'<th class="n">Unit FOB</th><th class="n">Total FOB</th>':'<th class="n">Target FOB</th>'}<th class="n">CBM</th></tr></thead><tbody>
  ${(h.items||[]).map(i=>`<tr><td>${i.foto?`<img src="${esc(i.foto)}">`:''}</td><td>${esc(i.codigo)}</td><td>${esc(i.cod_proveedor||'')}</td><td>${esc(i.descripcion)}<br><span class="m">${esc(i.material||'')}</span></td><td>${esc(i.medidas||'')}</td><td>${esc(i.color||'')}</td><td class="n">${i.q}</td>${oc?`<td class="n">${usd(i.fob).replace('US$','USD')}</td><td class="n">${usd((i.fob||0)*i.q).replace('US$','USD')}</td>`:`<td class="n">${i.fob?usd(i.fob).replace('US$','USD'):''}</td>`}<td class="n">${((i.cbm||0)*i.q).toFixed(2)}</td></tr>`).join('')}
  </tbody><tfoot><tr><td colspan="${oc?7:7}"></td>${oc?`<td class="n"><b>Total</b></td><td class="n"><b>${usd(h.total_fob).replace('US$','USD')}</b></td>`:'<td></td>'}<td class="n"><b>${(+h.cbm).toFixed(2)}</b></td></tr></tfoot></table>
  <div class="terms">${oc?`<b>Terms:</b> Incoterm FOB. Payment: 30% deposit against this purchase order, 70% balance before shipment. Please confirm production lead time, packing (carton size and gross weight) and shipping date. Goods must match approved samples, colors and finishes.`
  :`<b>Please quote:</b> unit FOB price, MOQ, production lead time, packing details (carton size, CBM, gross weight per unit) and validity of the offer. Target prices are indicative.`}</div>
  <button onclick="print()">Print / Save as PDF</button></body></html>`;
  const w=window.open('','_blank');if(!w){toast('Habilitá las ventanas emergentes para ver el documento');return}w.document.write(html);w.document.close();
}

/* ---------- arrepentimientos ---------- */
async function drawArr(){
  const {data,error}=await sb.from('arrepentimientos').select('*').order('created_at',{ascending:false});
  if(error){toast('Error al leer arrepentimientos');return}
  const EA=['nuevo','contactado','resuelto'];
  (document.getElementById('arrw')||$('#m')).innerHTML=`<div class="stats"><div class="card"><b>${data.filter(a=>a.estado==='nuevo').length}</b><span>sin responder (tenés 24 h)</span></div></div>
  ${data.length?`<div class="card wrap"><table><thead><tr><th>Código</th><th>Fecha</th><th>Cliente</th><th class="hide-m">Pedido / comentario</th><th>Estado</th></tr></thead><tbody>
  ${data.map(a=>`<tr><td>${esc(a.codigo)}</td><td>${new Date(a.created_at).toLocaleString('es-AR')}</td><td><b>${esc(a.nombre)}</b><div class="hint">${esc(a.email)} · ${esc(a.telefono)}</div></td>
   <td class="hide-m">${esc(a.pedido)}<div class="hint">${esc(a.motivo)}</div></td>
   <td><select data-a="${a.id}">${EA.map(s=>`<option ${s===a.estado?'selected':''}>${s}</option>`).join('')}</select></td></tr>`).join('')}</tbody></table></div>`
  :`<div class="card" style="padding:40px;text-align:center;color:var(--soft)">No hay solicitudes de arrepentimiento.</div>`}`;
  $('#m').querySelectorAll('select[data-a]').forEach(s=>s.onchange=async()=>{
    const {error}=await sb.from('arrepentimientos').update({estado:s.value}).eq('id',+s.dataset.a);
    toast(error?'No se pudo cambiar':'Estado actualizado');
  });
}

/* ---------- profesionales ---------- */
async function drawPro(){
  const {data,error}=await sb.from('profesionales').select('*').order('created_at',{ascending:false});
  if(error){toast('Error al leer profesionales');return}
  const ET={pendiente:'Pendiente',aprobado:'Aprobado',rechazado:'Rechazado'};
  $('#m').innerHTML=`<div class="stats"><div class="card"><b>${data.filter(p=>p.estado==='pendiente').length}</b><span>solicitudes por revisar</span></div><div class="card"><b>${data.filter(p=>p.estado==='aprobado').length}</b><span>profesionales aprobados</span></div></div>
  <p class="hint">Al aprobar, al profesional le llega un mail para entrar. Ve la tienda con los precios de la columna "Precio pro" (en Productos). Si un producto no tiene precio pro, le aparece "Consultar".</p>
  ${data.length?`<div class="card wrap"><table><thead><tr><th>Fecha</th><th>Profesional</th><th class="hide-m">Estudio · Rubro</th><th class="hide-m">CUIT</th><th>Estado</th></tr></thead><tbody>
  ${data.map(p=>`<tr><td>${new Date(p.created_at).toLocaleDateString('es-AR')}</td><td><b>${esc(p.nombre)}</b><div class="hint">${esc(p.email)} · ${esc(p.telefono)}</div></td>
   <td class="hide-m">${esc(p.estudio)}<div class="hint">${esc(p.rubro)}</div></td><td class="hide-m">${esc(p.cuit)}</td>
   <td><select data-pr="${p.id}">${Object.keys(ET).map(s=>`<option value="${s}" ${s===p.estado?'selected':''}>${ET[s]}</option>`).join('')}</select></td></tr>`).join('')}</tbody></table></div>`
  :`<div class="card" style="padding:40px;text-align:center;color:var(--soft)">Todavía no hay solicitudes. Los profesionales se registran desde la tienda, en Proyectos → Catálogo profesional.</div>`}`;
  const [{data:st},{data:ce},{data:pp}]=await Promise.all([sb.from('settings').select('*').order('key'),sb.rpc('contenedor_estado'),sb.from('pedidos_pro').select('*').order('created_at',{ascending:false})]);
  const c0=(ce&&ce[0])||{cap:71,usado:0},pct=Math.round(c0.usado/c0.cap*100);
  const SL={cierre_contenedor:'Cierre estimado del contenedor',llegada_contenedor:'Llegada estimada a Buenos Aires',tc:'Tipo de cambio (ARS por USD)',markup_pro:'Margen profesionales sobre costo (0,40 = 40%)',iva:'IVA (0,21)',cap_cbm:'Capacidad del contenedor (m³)'};
  $('#m').insertAdjacentHTML('beforeend',`<h3 style="margin:28px 0 10px">Contenedor compartido</h3>
  <div class="stats"><div class="card"><b>${pct}%</b><span>lleno · ${(+c0.usado).toFixed(2)} de ${c0.cap} m³ (preventa pagada + reservas pro)</span></div></div>
  <div class="card wrap"><table><thead><tr><th>Parámetro</th><th class="n">Valor</th></tr></thead><tbody>${(st||[]).filter(s=>['cap_cbm','cierre_contenedor','llegada_contenedor'].includes(s.key)).map(s=>{const dt=/contenedor$/.test(s.key)&&s.key!=='cap_cbm';const v=String(s.value);return `<tr><td>${esc(SL[s.key]||s.key)}</td><td class="n">${dt?`<input type="date" style="width:170px" data-st="${esc(s.key)}" data-dt="1" value="${v.length===8?v.slice(0,4)+'-'+v.slice(4,6)+'-'+v.slice(6):''}">`:`<input class="num n" data-st="${esc(s.key)}" value="${s.value}">`}</td></tr>`}).join('')}</tbody></table></div>
  <p class="hint">El precio profesional se calcula solo: costo puesto en Argentina × (1 + margen) + IVA, al tipo de cambio de arriba. Si cargás un "Precio pro" en Productos, ese manda.</p>
  <h3 style="margin:28px 0 10px">Reservas de profesionales</h3>
  ${(pp||[]).length?`<div class="card wrap"><table><thead><tr><th>#</th><th>Fecha</th><th>Profesional</th><th class="hide-m">Productos</th><th class="n">m³</th><th class="n">Total</th><th>Estado</th></tr></thead><tbody>${pp.map(o=>`<tr><td>${o.id}</td><td>${new Date(o.created_at).toLocaleDateString('es-AR')}</td><td><b>${esc(o.nombre)}</b><div class="hint">${esc(o.estudio)} · ${esc(o.email)}</div></td><td class="hide-m">${(o.items||[]).map(i=>`${i.q}× ${esc(i.producto)} · ${esc(i.color)}`).join('<br>')}</td><td class="n">${(+o.cbm).toFixed(2)}</td><td class="n">${ars(o.total)}</td><td><select data-pp="${o.id}">${['reservado','confirmado','cancelado'].map(s=>`<option ${s===o.estado?'selected':''}>${s}</option>`).join('')}</select></td></tr>`).join('')}</tbody></table></div>`:`<div class="card" style="padding:28px;text-align:center;color:var(--soft)">Todavía no hay reservas.</div>`}`);
  $('#m').querySelectorAll('[data-st]').forEach(i=>i.onchange=()=>{const v=i.dataset.dt?+i.value.replace(/-/g,''):parseFloat(i.value.replace(',','.'));if(isNaN(v)){toast('Número inválido');return}mark(i,'settings','key',i.dataset.st,'value',v)});
  $('#m').querySelectorAll('[data-pp]').forEach(s=>s.onchange=async()=>{const {error}=await sb.from('pedidos_pro').update({estado:s.value}).eq('id',+s.dataset.pp);toast(error?'No se pudo cambiar':'Estado actualizado')});
  $('#m').querySelectorAll('select[data-pr]').forEach(s=>s.onchange=async()=>{
    s.disabled=true;
    const {data:{session}}=await sb.auth.getSession();
    const r=await fetch('/api/pro-approve',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+session.access_token},body:JSON.stringify({id:+s.dataset.pr,estado:s.value})});
    const d=await r.json().catch(()=>({}));s.disabled=false;
    toast(!r.ok?(d.error||'No se pudo cambiar'):d.aviso||(d.invitado?'Aprobado: le mandamos el mail de acceso':'Estado actualizado'));
  });
}

/* ---------- pedidos ---------- */
async function loadOrders(){const {data,error}=await sb.from('orders').select('*,order_items(*,products(tipo,nombre))').order('created_at',{ascending:false});if(error){toast('Error al leer pedidos');return}orders=data}
function drawOrders(){
  const pag=orders.filter(o=>o.estado!=='pendiente'&&o.estado!=='cancelado');
  $('#m').innerHTML=`<div class="stats"><div class="card"><b>${pag.length}</b><span>pedidos pagados</span></div><div class="card"><b>${ars(pag.reduce((a,o)=>a+o.total,0))}</b><span>vendido</span></div><div class="card"><b>${orders.filter(o=>o.estado==='pagado').length}</b><span>por despachar</span></div></div>
  <div class="bar"><span class="sp"></span><button class="btn" id="csv">Exportar a Excel (CSV)</button></div>
  ${orders.length?`<div class="card wrap"><table><thead><tr><th>#</th><th>Fecha</th><th>Cliente</th><th class="hide-m">Productos</th><th class="hide-m">Envío</th><th class="n">Total</th><th>Estado</th></tr></thead><tbody>
  ${orders.map(o=>`<tr><td>${o.id}</td><td>${new Date(o.created_at).toLocaleDateString('es-AR')}</td><td><b>${esc(o.nombre)}</b><div class="hint">${esc(o.email)} · ${esc(o.telefono)}</div></td>
   <td class="hide-m">${(o.order_items||[]).map(i=>`${i.cantidad}× ${esc(i.products?i.products.tipo+' '+i.products.nombre:i.product_id)}${i.color?' · '+esc(i.color):''}`).join('<br>')}</td>
   <td class="hide-m">${esc(o.envio)}<div class="hint">${esc(o.direccion)} ${esc(o.cp)}</div></td><td class="n">${ars(o.total)}</td>
   <td><select data-o="${o.id}">${ESTADOS.map(s=>`<option value="${s}" ${s===o.estado?'selected':''}>${EST_TXT[s]}</option>`).join('')}</select></td></tr>`).join('')}</tbody></table></div>`
  :`<div class="card" style="padding:40px;text-align:center;color:var(--soft)">Todavía no hay pedidos. Cuando conectemos Mercado Pago, cada compra aparece acá.</div>`}`;
  $('#m').querySelectorAll('select[data-o]').forEach(s=>s.onchange=async()=>{
    const {data:{session}}=await sb.auth.getSession();const rr=await fetch('/api/estado',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+session.access_token},body:JSON.stringify({id:+s.dataset.o,estado:s.value})});const dd=await rr.json().catch(()=>({}));const error=rr.ok?null:dd;
    toast(error?'No se pudo cambiar el estado':dd.mail?'Estado actualizado y le avisamos al cliente por mail':'Estado actualizado');if(!error)orders.find(o=>o.id===+s.dataset.o).estado=s.value;
  });
  $('#csv').onclick=()=>{
    const rows=[['Pedido','Fecha','Estado','Cliente','Mail','Teléfono','Dirección','CP','Envío','Productos','Total']].concat(orders.map(o=>[o.id,new Date(o.created_at).toLocaleString('es-AR'),EST_TXT[o.estado],o.nombre,o.email,o.telefono,o.direccion,o.cp,o.envio,(o.order_items||[]).map(i=>`${i.cantidad}x ${i.products?i.products.tipo+' '+i.products.nombre:i.product_id}`).join(' | '),o.total]));
    const csv='﻿'+rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(';')).join('\n');
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='pedidos-forma.csv';a.click();
  };
}
start();
</script>
