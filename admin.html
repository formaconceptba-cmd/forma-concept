/* ===== Estilo Tiendanube (Nimbus): Geist, fondo #F6F6F6, tarjetas blancas radio 8, primario #0059D5 ===== */
:root{--bg:#F6F6F6;--line:#E3E3E3;--ink:#0A0A0A;--soft:#5D5D5D;--pri:#0059D5;--pri2:#00429F;--prib:#EEF5FF;--f:"Geist",-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif}
body{background:var(--bg);font:14px/20px var(--f)}
.tn{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
.tn-side{background:#fff;border-right:1px solid var(--line);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;overflow:auto;z-index:20}
.tn-logo{font:600 22px var(--f);letter-spacing:-.02em;padding:16px 20px 14px;color:var(--ink)}.tn-logo small{font:500 11px var(--f);letter-spacing:.1em;text-transform:uppercase;color:var(--soft);margin-left:8px}
.tn-menu{display:block;padding:4px 8px;flex:1}.tn-foot{padding:8px;border-top:1px solid var(--line)}
.tn-g{margin-bottom:2px}
.tn-i{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;border-radius:8px;padding:8px 10px;font:500 14px/20px var(--f);color:var(--ink);cursor:pointer;text-align:left}
.tn-i:hover{background:#F6F6F6}.tn-i svg{flex:0 0 auto;color:var(--soft)}.tn-i.on,.tn-g.act>.tn-i{color:var(--pri)}.tn-i.on{background:var(--prib)}.tn-i.on svg,.tn-g.act>.tn-i svg{color:var(--pri)}
.tn-i span{flex:1}.tn-ch{width:7px;height:7px;border-right:1.5px solid var(--soft);border-bottom:1.5px solid var(--soft);transform:rotate(45deg);margin:-4px 4px 0}.tn-ch.up{transform:rotate(-135deg);margin-top:4px}
.tn-sub{display:flex;flex-direction:column;padding:2px 0 6px 38px}
.tn-sub button{border:0;background:none;text-align:left;padding:6px 10px;border-radius:8px;font:400 14px/20px var(--f);color:var(--soft);cursor:pointer}.tn-sub button:hover{background:#F6F6F6;color:var(--ink)}.tn-sub button.on{background:var(--prib);color:var(--pri);font-weight:500}
.tn-main{min-width:0}
.tn-top{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:14px;padding:8px 24px;background:var(--bg);border-bottom:1px solid var(--line)}
.tn-top .who{font-size:12px;color:var(--soft)}.tn-a{font-size:13px;color:var(--pri);text-decoration:none}
.tn-hb{display:none;border:0;background:none;font-size:20px;cursor:pointer;padding:4px 8px}
.tn-ph{max-width:1440px;margin:0 auto;padding:20px 24px 4px}.tn-ph h1{font:600 24px/28px var(--f);margin:0;color:var(--ink)}
.tn-main main{max-width:1440px;margin:0 auto;padding:16px 24px 48px}
.tn-back{display:none}
/* componentes */
.card{background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.btn{border:1px solid #B0B0B0;background:#fff;border-radius:8px;padding:6px 12px;min-height:32px;font:500 14px/18px var(--f);cursor:pointer}
.btn:hover{background:#F6F6F6}
.btn.dk{background:var(--pri);border-color:var(--pri);color:#fff}.btn.dk:hover{background:var(--pri2);border-color:var(--pri2)}
.lnk{color:var(--pri)}
input,select,textarea{border-color:#B0B0B0;border-radius:8px;font-family:var(--f)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--prib);border-color:var(--pri)}
label{font:500 12px/16px var(--f);letter-spacing:0;text-transform:none;color:var(--ink)}
th{background:#fff;color:var(--soft);font:500 12px/16px var(--f);letter-spacing:0;text-transform:none;border-bottom:1px solid var(--line)}
td{border-bottom:1px solid #EFEFEF}
table tbody tr:hover td{background:#FAFAFA}
.hint{color:var(--soft)}
.tag{border-radius:999px}
dialog{border:0;border-radius:12px;box-shadow:0 10px 40px rgba(0,0,0,.18)}
@media(max-width:1024px){
 .tn{grid-template-columns:1fr}
 .tn-side{position:fixed;left:0;top:0;width:260px;transform:translateX(-100%);transition:transform .2s;box-shadow:0 0 30px rgba(0,0,0,.15)}
 body.tn-open .tn-side{transform:none}body.tn-open .tn-back{display:block;position:fixed;inset:0;background:rgba(0,0,0,.25);z-index:15}
 .tn-hb{display:block}.tn-ph,.tn-main main{padding-left:16px;padding-right:16px}
}

<script>
const SB_URL='https://znzbwtewxpcpqtmjbmdw.supabase.co', SB_KEY='sb_publishable_DRouvIiAf-Vj354iZnNx5Q_XoOt3akE';
const sb=supabase.createClient(SB_URL,SB_KEY);
const PRE=0.45, OFF_1P=0.15;
const ESTADOS=['pendiente','pagado','en_camino','entregado','cancelado'];
const EST_TXT={pendiente:'Pendiente de pago',pagado:'Pagado',en_camino:'En camino',entregado:'Entregado',cancelado:'Cancelado'};
const $=s=>document.querySelector(s);
const app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ars=n=>n==null?'—':'$'+Math.round(n).toLocaleString('es-AR');
const pre=l=>l?Math.ceil(l*(1-PRE)/1000)*1000:null;
const src=n=>!n?'':/^https?:/.test(n)?n:'img/'+n+'.jpg';
function toast(t){const e=$('#toast');e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,2600)}
let CUENTAS='mayorista', PEDF='publico', PRODF='';
let tab='inicio', prods=[], orders=[], user=null, q='';

/* ---------- ingreso ---------- */
function viewLogin(msg=''){
  app.innerHTML=`<div class="card" id="login"><h1>forma</h1><p>Panel de administración.</p>
  <form id="lf"><label>Mail</label><input type="email" id="em" required autocomplete="username" value="formaconcept.ba@gmail.com">
  <label style="margin-top:10px">Contraseña</label><input type="password" id="pw" required autocomplete="current-password">
  <button class="btn dk" style="width:100%;margin-top:16px">Entrar</button></form>
  <p class="hint" style="margin-top:14px"><button class="lnk" id="fp">¿Primera vez o te olvidaste la contraseña?</button></p>
  <p class="hint" id="lm" style="margin-top:8px">${esc(msg)}</p></div>`;
  $('#lf').onsubmit=async e=>{e.preventDefault();const b=e.target.querySelector('button');b.disabled=true;
    const {error}=await sb.auth.signInWithPassword({email:$('#em').value.trim(),password:$('#pw').value});
    b.disabled=false;if(error)$('#lm').textContent='Mail o contraseña incorrectos. Si nunca creaste una contraseña, tocá el link de arriba.'};
  $('#fp').onclick=async()=>{const em=$('#em').value.trim();if(!em){$('#lm').textContent='Escribí tu mail primero.';return}
    const {error}=await sb.auth.resetPasswordForEmail(em,{redirectTo:location.origin+'/admin'});
    $('#lm').textContent=error?'No pudimos mandar el mail. Probá en unos minutos.':'Te mandamos un mail para crear tu contraseña. Abrilo y seguí el link.'};
}
function viewNewPass(){
  app.innerHTML=`<div class="card" id="login"><h1>forma</h1><p>Elegí tu contraseña para entrar al panel. Mínimo 8 caracteres.</p>

const SORT={};
function sortBy(tab,list,get){const s=SORT[tab];if(!s)return list;return [...list].sort((a,b)=>{const x=get(a,s.k),y=get(b,s.k);if(x==null||x==='')return 1;if(y==null||y==='')return -1;return (typeof x==='number'&&typeof y==='number'?x-y:String(x).localeCompare(String(y),'es'))*s.d})}
const thS=(tab,k,t,c='')=>`<th class="s ${c}" data-st2="${tab}|${k}">${t}${SORT[tab]?.k===k?(SORT[tab].d>0?' ↑':' ↓'):''}</th>`;

/* achica la foto (máx. 2400 px) y la pasa a JPG antes de subirla */
async function achicar(file){
  let bmp;try{bmp=await createImageBitmap(file)}catch(e){throw new Error(/heic|heif/i.test(file.type+file.name)?'Ese formato (HEIC, de iPhone) no se puede abrir acá. Exportala como JPG y volvé a probar.':'No pudimos abrir esa imagen. Probá con un JPG o PNG.')}
  const s=Math.min(1,2400/Math.max(bmp.width,bmp.height)),c=document.createElement('canvas');c.width=Math.round(bmp.width*s);c.height=Math.round(bmp.height*s);
  c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);const b=await new Promise(r=>c.toBlob(r,'image/jpeg',.86));if(!b)throw new Error('No pudimos procesar la imagen.');
  return new File([b],'foto.jpg',{type:'image/jpeg'});
}
async function subirFoto(file,carpeta){

  return sb.storage.from('fotos').getPublicUrl(path).data.publicUrl;

/* ---------- maestro · economía · compras ---------- */
let master=[], ST={}, MF={q:'',prov:'',cat:'',mat:'',est:'',sort:'codigo',dir:1,view:'tabla'};
let OC=[];try{OC=JSON.parse(localStorage.getItem('fa_oc')||'[]')}catch(e){}
const saveOC=()=>{try{localStorage.setItem('fa_oc',JSON.stringify(OC))}catch(e){}};
async function loadMaster(){const [{data:m},{data:s}]=await Promise.all([sb.from('master_productos').select('*').order('codigo'),sb.from('settings').select('*')]);master=m||[];ST=Object.fromEntries((s||[]).map(x=>[x.key,+x.value]))}
const costo=(fob,cbm)=>{if(fob==null||cbm==null)return null;const s=ST,fl=s.flete_cont*cbm/s.cap_cbm,cif=fob+fl+fob*s.seguro;return (cif+s.gastos_fijos_cont*cbm/s.cap_cbm+fob*s.honorarios+s.resguardo*cbm/s.cap_cbm+cif*s.arancel)*(1+s.imprevistos)};
const usd=n=>n==null?'—':'US$ '+(+n).toLocaleString('es-AR',{minimumFractionDigits:2,maximumFractionDigits:2});
const pct=n=>n==null||!isFinite(n)?'—':Math.round(n*100)+'%';
const ppro=m=>{const c=costo(m.fob_usd,m.cbm);return c==null?null:Math.ceil(c*(1+(m.markup??ST.markup_pro))*(1+ST.iva)*ST.tc/1000)*1000};
const byCod=c=>master.find(m=>m.codigo===c);
const uniq=k=>[...new Set(master.map(m=>m[k]).filter(Boolean))].sort();

    &&(!MF.q||[m.codigo,m.descripcion,m.cod_proveedor,m.material,m.medidas,m.familia].join(' ').toLowerCase().includes(MF.q.toLowerCase())));
  const val=m=>({costo:costo(m.fob_usd,m.cbm),pro:ppro(m)}[MF.sort]??m[MF.sort]);
  L.sort((a,b)=>{const x=val(a),y=val(b);if(x==null)return 1;if(y==null)return -1;return (typeof x==='number'?x-y:String(x).localeCompare(String(y)))*MF.dir});
  const opt=(k,lab)=>`<select class="sel" data-mf="${k}"><option value="">${lab}</option>${uniq({prov:'proveedor',cat:'subcategoria',mat:'material',est:'estado'}[k]).map(v=>`<option ${MF[k]===v?'selected':''}>${esc(v)}</option>`).join('')}</select>`;

  <div class="bar"><input id="mq" placeholder="Buscar código, nombre, material…" value="${esc(MF.q)}">${opt('prov','Proveedor')}${opt('cat','Subcategoría')}${opt('mat','Material')}${opt('est','Estado')}<span class="sp"></span>

  :`<div class="card wrap"><table><thead><tr><th></th>${th('codigo','Producto')}${th('proveedor','Proveedor','hide-m')}${th('subcategoria','Subcategoría','hide-m')}${th('material','Material','hide-m')}${th('medidas','Medidas (mm)','hide-m')}${th('moq','MOQ','n')}${th('fob_usd','FOB','n')}${th('cbm','m³','n')}${th('costo','Costo puesto','n')}<th class="n">Margen pro</th>${th('pro','Precio pro','n')}<th></th></tr></thead><tbody>
  ${L.map(m=>`<tr><td><img src="${esc(m.foto_url||'')}" alt="" loading="lazy"></td><td><b>${esc(m.descripcion)}</b> ${inShop.has(m.codigo)?'<span class="tag">en tienda</span>':''}${(typeof ECO!=='undefined'?ECO.it.filter(i=>i.codigo===m.codigo):[]).map(i=>{const pe=ECO.ped.find(p=>p.id===i.pedido_id);return pe?` <span class="tag" title="${esc(ESTP[pe.estado]||pe.estado)}">${esc(pe.nombre)} · ${i.cant} u.</span>`:''}).join('')}<div class="hint">${esc(m.codigo)} · ${esc(m.cod_proveedor||'')} · ${esc(m.estado||'')}</div></td>
   <td class="hide-m">${esc(m.proveedor)}</td><td class="hide-m">${esc(m.subcategoria)}</td><td class="hide-m">${esc(m.material)}<div class="hint">${esc(m.terminacion||'')}</div></td><td class="hide-m">${esc(m.medidas)}</td>
   <td class="n">${m.moq??'—'}</td><td class="n">${usd(m.fob_usd)}</td><td class="n">${m.cbm??'—'}</td><td class="n">${usd(costo(m.fob_usd,m.cbm))}</td>
   <td class="n"><input class="num n" style="width:70px" data-mk="${esc(m.codigo)}" value="${m.markup!=null?Math.round(m.markup*100):''}" placeholder="${Math.round(ST.markup_pro*100)}" title="% sobre costo. Vacío = general"></td>
   <td class="n">${ars(ppro(m))}</td><td style="white-space:nowrap"><button class="lnk" data-oc="${esc(m.codigo)}">+ OC</button> · <button class="lnk" data-addpro="${esc(m.codigo)}">+ Pro</button></td></tr>`).join('')}</tbody></table></div>`}
  <p class="hint">Costo puesto en Argentina por unidad, sin IVA, con el contenedor lleno (parámetros en Economía). Precio pro = costo × (1 + margen) + IVA, al tipo de cambio.</p>`;
  $('#mq').oninput=e=>{MF.q=e.target.value;const p=e.target.selectionStart;drawMaster();const i=$('#mq');i.focus();i.setSelectionRange(p,p)};
  $('#m').querySelectorAll('[data-mf]').forEach(s=>s.onchange=()=>{MF[s.dataset.mf]=s.value;drawMaster()});
  $('#m').querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{MF.view=b.dataset.v;drawMaster()});
  $('#m').querySelectorAll('[data-sort]').forEach(h=>h.onclick=()=>{const k=h.dataset.sort;MF.dir=MF.sort===k?-MF.dir:1;MF.sort=k;drawMaster()});
  $('#m').querySelectorAll('[data-mk]').forEach(i=>i.onchange=()=>{const v=i.value.trim()===''?null:(+i.value.replace(',','.'))/100;byCod(i.dataset.mk).markup=v;mark(i,'master_productos','codigo',i.dataset.mk,'markup',v)});

}

/* ---------- rentabilidad: cuánto queda de cada venta ---------- */
const MEDIO={transferencia:'Transferencia directa',credit_card:'Tarjeta de crédito',debit_card:'Tarjeta de débito',prepaid_card:'Tarjeta prepaga',account_money:'Dinero en cuenta MP',ticket:'Efectivo (Rapipago / Pago Fácil)',bank_transfer:'Transferencia',atm:'Cajero',digital_currency:'Mercado Crédito',digital_wallet:'Billetera virtual'};
const medioTxt=o=>(MEDIO[o.medio_pago]||o.medio_pago||'Mercado Pago')+(o.cuotas>1?` · ${o.cuotas} cuotas`:o.medio_pago==='credit_card'?' · 1 pago':'');
const TX=()=>({IVA:ST.iva??0.21,COM:ST.comision_mp??0.043,ENV:ST.envio_costo||0,IIBB:ST.iibb??0.03,CHQ:ST.imp_cheque??0.006,GAN:ST.ganancias??0.30,FIJ:ST.gastos_fijos_mes||0,ADS:ST.ads_gasto||0});
const CANAL={pub:'Público (tienda)',pro:'Profesionales',may:'Mayoristas (contenedor)'};
/* costo de 1 unidad puesta en Argentina, en pesos y sin IVA */
let ECOC={};
const cuR=id=>{const m=byCod(id),pz=m&&+m.piezas_por_caja||1;if(ECOC[id])return ECOC[id]*ST.tc*pz;if(m){const c=costo(m.fob_usd,m.cbm);if(c!=null)return c*ST.tc*pz}const p=prods.find(p=>p.id===id);return p&&p.costo_manual!=null?+p.costo_manual:null};
/* todas las ventas cobradas, con lo que se lleva cada uno */
async function ventasRent(){
  if(!prods.length)await loadProds();
  try{await ecoLoad();ECOC=ecoCostos()}catch(e){ECOC={}}
  const [{data:os},{data:pp}]=await Promise.all([sb.from('orders').select('*,order_items(*,products(tipo,nombre))').order('created_at',{ascending:false}),sb.from('pedidos_pro').select('*').order('created_at',{ascending:false})]);
  const T=TX(),pag=(os||[]).filter(o=>o.estado!=='pendiente'&&o.estado!=='cancelado');
  /* el costo de cada venta se guarda la primera vez: así no cambia si después sube el dólar */
  const fr=[];pag.forEach(o=>(o.order_items||[]).forEach(i=>{if(i.costo_unit==null){const c=cuR(i.product_id);if(c!=null){i.costo_unit=Math.round(c);fr.push(sb.from('order_items').update({costo_unit:i.costo_unit}).eq('id',i.id))}}}));
  if(fr.length)await Promise.all(fr);
  const fin=(v)=>{v.iibb=v.venta*T.IIBB;v.chq=v.total*T.CHQ;v.g=v.venta-v.cprod-v.com-v.env-v.iibb-v.chq;v.m=v.venta?v.g/v.venta:null;return v};
  const V=pag.map(o=>{const its=o.order_items||[];return fin({id:'#'+o.id,f:o.created_at,canal:o.canal==='profesional'?'pro':'pub',cli:o.nombre,det:its.map(i=>`${i.cantidad}× ${i.products?i.products.tipo+' '+i.products.nombre:i.product_id} a ${ars(i.precio)}${i.regla?' ('+i.regla+(i.precio_lista_momento?', lista '+ars(i.precio_lista_momento):'')+')':''}`).join(', '),
    medio:medioTxt(o),total:o.total,its:its.map(i=>({id:i.product_id,q:i.cantidad,p:i.precio,c:i.costo_unit,l:i.precio_lista_momento,r:i.regla})),mp:o.medio_pago,cuotas:o.cuotas||1,tk:o.tracking||null,em:(o.email||'').trim().toLowerCase(),tel:o.telefono,venta:o.total/(1+T.IVA),cprod:its.reduce((a,i)=>a+(i.costo_unit||0)*i.cantidad,0),falta:its.some(i=>i.costo_unit==null),
    com:o.comision_real!=null?+o.comision_real:o.total*T.COM,comReal:o.comision_real!=null,env:/gratis|express/i.test(o.envio||'')?T.ENV:0,est:EST_TXT[o.estado]})});
  (pp||[]).filter(r=>r.estado!=='cancelado').forEach(r=>{const its=r.items||[];let falta=false;const cprod=its.reduce((a,i)=>{const c=cuR(i.id||i.codigo);if(c==null){falta=true;return a}return a+c*i.q},0);
    V.push(fin({id:'R'+r.id,f:r.created_at,canal:'may',its:its.map(i=>({id:i.id||i.codigo,q:i.q,p:i.precio,c:cuR(i.id||i.codigo)})),mp:'transferencia',cuotas:1,tk:null,em:(r.email||'').trim().toLowerCase(),tel:r.telefono,cli:r.estudio||r.nombre,det:its.map(i=>`${i.q}× ${i.producto}`).join(', '),medio:'Transferencia',total:r.total,venta:r.total/(1+T.IVA),cprod,falta,com:0,env:0,est:r.estado==='confirmado'?'Confirmada':'Reservada, sin confirmar'}))});
  return V.sort((a,b)=>b.f.localeCompare(a.f));
}

   ${R('Ganancia antes de impuesto a las Ganancias',antes,'','sub')}

  </tbody></table></div>
  <div><h4>Quién te compró</h4><div class="wrap"><table><thead><tr><th></th><th class="n">Ventas</th><th class="n">Sin IVA</th><th class="n">Ganancia</th><th class="n">Margen</th></tr></thead><tbody>${CAN.map(c=>`<tr><td><b>${CANAL[c.c]}</b></td><td class="n">${c.n}</td><td class="n">${ars(c.ve)}</td><td class="n">${ars(c.g)}</td><td class="n">${mc(c.m)}</td></tr>`).join('')}</tbody></table></div>
   <p class="hint">Margen = lo que te queda de cada $100 vendidos sin IVA, antes de anuncios y gastos fijos. Debajo de 15% está en rojo.</p>
   <h4 style="margin-top:16px">Tus números <small class="hint">— cambialos y se recalcula todo</small></h4>

   <div class="rw"><span>Ingresos Brutos</span><span>${inp('t_iibb',+(T.IIBB*100).toFixed(2),' %')}</span></div>

   <div class="rw"><span>Gastos fijos por mes<div class="hint">Se calcula solo en 6. Gastos (fijos + depósito Pailos). Cargalos ahí.</div></span><span>${inp('t_fij',T.FIJ,'',110)}</span></div>

/* Precios y reglas: el precio de lista nace en Contenedores (o en Productos para los nacionales); todo lo demás sale de estas reglas */
async function drawRent(){
  if(!prods.length)await loadProds();
  try{await ecoLoad();ECOC=ecoCostos()}catch(e){ECOC={}}
  const [{data:pc},{data:ct},{data:hi}]=await Promise.all([sb.rpc('precios_admin'),sb.from('cobro_transf').select('*').eq('id',1).maybeSingle(),sb.from('precio_historial').select('*').order('fecha',{ascending:false}).limit(40)]);
  const T=TX(),C3=(T.COM/1.21+0.1049)*1.21,PB=Object.fromEntries(prods.map(p=>[p.id,p])),D=ct||{};
  /* margen = lo que queda de cada $100 sin IVA, descontados costo, comisión, Ingresos Brutos e impuesto al cheque */
  const mg=(precio,c,com)=>{if(!precio||c==null)return null;const n=precio/(1+T.IVA);return (n-c-precio*com-n*T.IIBB-precio*T.CHQ)/n};
  let S=(pc||[]).filter(x=>PB[x.id]&&PB[x.id].activo).map(x=>{const p=PB[x.id],c=cuR(x.id);return {p,x,c,F:[[x.publico,mg(x.publico,c,T.COM)],[x.publico,mg(x.publico,c,C3)],[x.transf,mg(x.transf,c,0)],[x.prof,mg(x.prof,c,T.COM)],[x.prof_transf,mg(x.prof_transf,c,0)],[x.may,mg(x.may,c,0)]]}});
  S=sortBy('rent',S,(r,k)=>({nombre:r.p.tipo+' '+r.p.nombre,costo:r.c,pub:r.F[0][1],c3:r.F[1][1],tr:r.F[2][1],pro:r.F[3][1],may:r.F[5][1]}[k]));
  const mc=x=>x==null?'':`<div class="${x<0.15?'neg':'pos'}">${pct(x)}</div>`;
  const pin=(id,v,suf='%')=>`<input id="${id}" class="num" style="width:64px" value="${v}" inputmode="decimal"> ${suf}`;
  const CAMPO={precio_lista:'Precio de lista',precio_preventa:'Precio de preventa fijo',pct_preventa:'% de preventa',pct_profesional:'% profesional propio',mayorista_lista:'Lista mayorista',mayorista_descuento:'% mayorista propio',regla_prof:'Regla: profesional',regla_may:'Regla: mayorista',desc_transf:'Regla: transferencia',preventa_activa:'Preventa activa',cuotas_sin_interes:'Cuotas sin interés',cuotas_max:'Máximo de cuotas'};
  const hv=(c,v)=>v==null?'—':/^(pct|desc|regla|mayorista_descuento)/.test(c)?pct(+v):c==='preventa_activa'?(+v?'sí':'no'):/cuotas/.test(c)?v:ars(v);
  $('#m').innerHTML=`<div class="bar"><b style="font:500 20px Outfit,sans-serif">Precios y reglas</b></div>
  <p class="hint" style="max-width:820px">Cada producto tiene <b>un solo precio que se carga a mano: el de lista</b> (en Contenedores → Precios, o en Productos para los nacionales). Todos los demás salen de estas reglas, así nunca quedan al revés: público → profesional → mayorista. Cada venta guarda el precio y la regla que se usó ese día.</p>
  <div class="g2d" style="align-items:start"><div class="card pad"><h4>Reglas</h4>
   <div class="rw"><span><b>Preventa activa</b><div class="hint">Si la apagás, el público paga el precio de lista y todo se recalcula.</div></span><span><input type="checkbox" id="r_pa" ${(ST.preventa_activa??1)>0?'checked':''} style="width:auto"></span></div>
   <div class="rw"><span>Transferencia: descuento sobre el precio público</span><span>${pin('r_dt',Math.round((ST.desc_transf??0.15)*100))}</span></div>
   <div class="rw"><span>Profesional: descuento sobre el precio público</span><span>${pin('r_rp',Math.round((ST.regla_prof??0.10)*100))}</span></div>
   <div class="rw"><span>Mayorista: descuento sobre el público con transferencia</span><span>${pin('r_rm',Math.round((ST.regla_may??0.20)*100))}</span></div>
   <div class="rw"><span>Cuotas sin interés (las pagás vos)</span><span>${pin('r_cs',ST.cuotas_sin_interes??3,'')}</span></div>
   <div class="rw"><span>Máximo de cuotas (las de más, con interés para el cliente)</span><span>${pin('r_cm',ST.cuotas_max??12,'')}</span></div>
   <p class="hint">Las cuotas sin interés se activan en tu cuenta de Mercado Pago (Tu negocio → Costos y cuotas). Cuestan ${(C3*100).toFixed(1).replace('.',',')}% de la venta en 3 cuotas.</p></div>
   <div class="card pad"><h4>Cuenta para transferencias</h4><p class="hint">Es lo que ve el cliente cuando elige pagar con transferencia (y le llega por mail).</p>
   ${[['titular','Titular'],['cuit','CUIT'],['banco','Banco'],['alias','Alias'],['cbu','CBU / CVU']].map(([k,l])=>`<div class="rw"><span>${l}</span><input data-ct="${k}" value="${esc(D[k]||'')}" style="width:220px"></div>`).join('')}
   <div class="rw"><span>Horas para pagar</span><input data-ct="horas" value="${D.horas??48}" class="num" style="width:64px" inputmode="numeric"></div>
   ${D.alias||D.cbu?'':'<p class="hint neg">Cargá el alias o el CBU: sin eso el cliente no sabe a dónde transferir.</p>'}
   <p class="hint">Cuando llega la plata, en Pedidos cambiás el estado a <b>Pagado</b>: se descuenta el stock y al cliente le llega el mail de confirmación.</p></div></div>
  <h3 style="margin:22px 0 10px">Precio y margen de cada producto, según quién compra y cómo paga</h3>
  <p class="hint" style="max-width:820px">Arriba el precio con IVA; abajo qué % del precio sin IVA te queda después del costo puesto en Argentina, la comisión, Ingresos Brutos e impuesto al cheque. En rojo, menos de 15%.</p>
  <div class="card wrap"><table class="big"><thead><tr><th></th>${thS('rent','nombre','Producto')}<th class="n">Lista</th>${thS('rent','costo','Costo','n')}${thS('rent','pub','Público<br>Mercado Pago','n')}${thS('rent','c3','Público<br>3 cuotas s/int.','n')}${thS('rent','tr','Público<br>transferencia','n')}${thS('rent','pro','Profesional','n')}<th class="n">Profesional<br>transferencia</th>${thS('rent','may','Mayorista','n')}</tr></thead><tbody>
  ${S.map(r=>`<tr><td><img src="${esc(src(r.p.img))}" alt=""></td><td><b>${esc(r.p.tipo)} ${esc(r.p.nombre)}</b><div class="hint">${esc(r.p.id)} · ${esc(r.x.regla)}${ECOC[r.p.id]?' · costo del contenedor':''}</div></td><td class="n">${ars(r.x.lista)}</td>
   <td class="n">${ECOC[r.p.id]||byCod(r.p.id)?ars(r.c)+'<div class="hint">sin IVA</div>':`<input class="num n" style="width:100px" data-cm="${esc(r.p.id)}" value="${r.p.costo_manual??''}" placeholder="cargá el costo" inputmode="numeric"><div class="hint">a mano, sin IVA</div>`}</td>
   ${r.F.map(([v,m])=>`<td class="n">${ars(v)}${mc(m)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>
  <h3 style="margin:22px 0 10px">Últimos cambios de precio</h3>
  ${(hi||[]).length?`<div class="card wrap"><table><thead><tr><th>Fecha</th><th>Producto / regla</th><th>Qué cambió</th><th class="n">Antes</th><th class="n">Después</th><th class="hide-m">Quién</th></tr></thead><tbody>${hi.map(h=>`<tr><td>${new Date(h.fecha).toLocaleString('es-AR',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}</td><td>${esc(h.ref==='regla'?'—':(PB[h.ref]?PB[h.ref].tipo+' '+PB[h.ref].nombre:h.ref))}</td><td>${CAMPO[h.campo]||esc(h.campo)}</td><td class="n">${hv(h.campo,h.antes)}</td><td class="n">${hv(h.campo,h.despues)}</td><td class="hide-m hint">${esc(h.quien||'')}</td></tr>`).join('')}</tbody></table></div>`:'<p class="hint">Todavía no hubo cambios. Desde ahora queda registrado cada cambio de precio o de regla.</p>'}`;
  bindSort(drawRent);
  const setS=async(k,v,n)=>{ST[k]=v;const {error}=await sb.from('settings').upsert({key:k,value:v,nota:n});toast(error?'No se pudo guardar':'Guardado: la tienda ya usa la regla nueva');drawRent()};
  const num=s=>+String(s).replace(/[^0-9.,]/g,'').replace(',','.')||0;
  $('#r_pa').onchange=e=>setS('preventa_activa',e.target.checked?1:0,'1 = la tienda vende con precio de preventa, 0 = precio de lista');
  $('#r_dt').onchange=e=>setS('desc_transf',num(e.target.value)/100,'Descuento por pagar con transferencia');
  $('#r_rp').onchange=e=>setS('regla_prof',num(e.target.value)/100,'Profesional: descuento sobre el precio público vigente');
  $('#r_rm').onchange=e=>setS('regla_may',num(e.target.value)/100,'Mayorista: descuento sobre el precio público con transferencia');
  $('#r_cs').onchange=e=>setS('cuotas_sin_interes',Math.round(num(e.target.value)),'Cuotas sin interés que paga FORMA');
  $('#r_cm').onchange=e=>setS('cuotas_max',Math.max(1,Math.min(12,Math.round(num(e.target.value)))),'Máximo de cuotas');
  $('#m').querySelectorAll('[data-ct]').forEach(i=>i.onchange=async()=>{const k=i.dataset.ct,v=k==='horas'?(Math.round(num(i.value))||48):i.value.trim()||null;const {error}=await sb.from('cobro_transf').update({[k]:v}).eq('id',1);toast(error?'No se pudo guardar':'Guardado')});
  $('#m').querySelectorAll('[data-cm]').forEach(i=>i.onchange=async()=>{const d=i.value.replace(/\D/g,''),v=d?+d:null;const p=PB[i.dataset.cm];p.costo_manual=v;const {error}=await sb.from('products').update({costo_manual:v}).eq('id',p.id);toast(error?'No se pudo guardar':'Costo guardado');drawRent()});
}

/* ---------- pedidos ---------- */
async function loadOrders(){const {data,error}=await sb.from('orders').select('*,order_items(*,products(tipo,nombre))').order('created_at',{ascending:false});if(error){toast('Error al leer pedidos');return}orders=(data||[]).filter(o=>PEDF==='profesional'?o.canal==='profesional':o.canal!=='profesional')}
function drawOrders(){
  const pag=orders.filter(o=>o.estado!=='pendiente'&&o.estado!=='cancelado');
  $('#m').innerHTML=`<div class="stats"><div class="card"><b>${pag.length}</b><span>pedidos pagados</span></div><div class="card"><b>${ars(pag.reduce((a,o)=>a+o.total,0))}</b><span>vendido</span></div><div class="card"><b>${orders.filter(o=>o.estado==='pagado').length}</b><span>por despachar</span></div></div>
  <div class="bar"><span class="sp"></span><button class="btn" id="csv">Exportar a Excel (CSV)</button></div>
  ${orders.length?`<div class="card wrap"><table><thead><tr><th>#</th><th>Fecha</th><th>Cliente</th><th class="hide-m">Productos</th><th class="hide-m">Envío</th><th class="n">Total</th><th>Estado</th></tr></thead><tbody>
  ${orders.map(o=>`<tr><td>${o.id}</td><td>${new Date(o.created_at).toLocaleDateString('es-AR')}</td><td><b>${esc(o.nombre)}</b><div class="hint">${esc(o.email)} · ${esc(o.telefono)}</div></td>
   <td class="hide-m">${(o.order_items||[]).map(i=>`${i.cantidad}× ${esc(i.products?i.products.tipo+' '+i.products.nombre:i.product_id)}${i.color?' · '+esc(i.color):''}`).join('<br>')}</td>
   <td class="hide-m">${esc(o.envio)}<div class="hint">${esc(o.direccion)} ${esc(o.cp)}</div></td><td class="n">${ars(o.total)}</td>
   <td><select data-o="${o.id}">${ESTADOS.map(s=>`<option value="${s}" ${s===o.estado?'selected':''}>${EST_TXT[s]}</option>`).join('')}</select></td></tr>`).join('')}</tbody></table></div>`
  :`<div class="card" style="padding:40px;text-align:center;color:var(--soft)">Todavía no hay pedidos. Cuando conectemos Mercado Pago, cada compra aparece acá.</div>`}`;
  $('#m').querySelectorAll('select[data-o]').forEach(s=>s.onchange=async()=>{
    const {data:{session}}=await sb.auth.getSession();const rr=await fetch('/api/estado',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+session.access_token},body:JSON.stringify({id:+s.dataset.o,estado:s.value})});const dd=await rr.json().catch(()=>({}));const error=rr.ok?null:dd;
    toast(error?'No se pudo cambiar el estado':dd.mail?'Estado actualizado y le avisamos al cliente por mail':'Estado actualizado');if(!error)orders.find(o=>o.id===+s.dataset.o).estado=s.value;
  });
  $('#csv').onclick=()=>{
    const rows=[['Pedido','Fecha','Estado','Cliente','Mail','Teléfono','Dirección','CP','Envío','Productos','Total']].concat(orders.map(o=>[o.id,new Date(o.created_at).toLocaleString('es-AR'),EST_TXT[o.estado],o.nombre,o.email,o.telefono,o.direccion,o.cp,o.envio,(o.order_items||[]).map(i=>`${i.cantidad}x ${i.products?i.products.tipo+' '+i.products.nombre:i.product_id}`).join(' | '),o.total]));
    const csv='﻿'+rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(';')).join('\n');
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='pedidos-forma.csv';a.click();
  };
}
